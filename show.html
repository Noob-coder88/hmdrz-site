<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/app.css">
    <link rel="stylesheet" href="./styles/normalize.css">
    <link rel="shortcut icon" href="./images/logo.png" type="image/x-icon">
    <title>Shows.</title>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <section class="nav_content">
                    <div class="nav_logo">
                        <a href="./index.html" class="nav_button">
                            <img src="./images/logo.png" alt="H" class="nav_logo_img">
                        </a>
                    </div>
                    <div class="nav_buttons">
                        <ul class="nav_list">
                            <li class="nav_item">
                                <a href="./index.html" class="nav_button">Home</a>
                            </li>
                            <li class="nav_item">
                                <a href="#" class="nav_button nav_button--shows" target="_blank" >Shows</a>
                            </li>
                        </ul>
                    </div>
                </section>
            </nav>
        </div>
    </header>
    <main class="main">
        <div class="container">
            <section class="show">
                <a href="./shows.html" class="back_button" id="back-link"> ← Back to shows </a>
                <article class="show_content">
                    <div class="show_cover">
                        <img src="" alt="" class="show_cover_img" id="show-cover-img">
                    </div>
                    <div class="show_info">
                        <h1 id="show-title" class="show_title" ></h1>
                        <p class="show_status">     Status:         <span id="show-status"></span>     </p>
                        <p class="show_myrate">     My rating:      <span id="show-myrate"></span>  </p>
                        <p class="show_imdb">       IMDb:           <span id="show-imdb"></span>       </p>
                        <p class="show_seasons">   Seasons:        <span id="show-seasons"></span>    </p>
                        <p class="show_episodes">   Episodes:       <span id="show-episodes"></span>   </p>
                                                <a href="" target="_blank" rel="noopener" class="show_imdb_link" id="show-imdb-link">
                            [ View on IMDb ]
                        </a>
                    </div>
                    <div class="show_about">
                        <h2 class="show_about_title">About</h2>
                        <p id="show-description" class="show_about_text"></p>
                    </div>
                </article>
            </section>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <section class="footer_content">
                <nav class="footer_nav">
                    <ul class="footer_nav_list" >
                        <li class="footer_nav_item" >
                            <a href="mailto:hamidrezaahmadi@gmail.com" class="footer_nav_link" target="_blank">Email</a>
                        </li>
                        <li class="footer_nav_item">
                            <a href="https://t.me/PianistNoob" class="footer_nav_link" target="_blank">Telegram</a>
                        </li>
                        <li class="footer_nav_item">
                            <a href="https://github.com/Noob-coder88" class="footer_nav_link" target="_blank">GitHub</a>
                        </li >
                    </ul>
                </nav>
                <div class="copyrights">
                    <p class="copyright"> © 2026 Hamidreza Ahm</p>
                </div>
            </section>
        </div>
    </footer>
    <script src="./data/shows.js"></script>
<script>
    console.log(shows);
    const params = new URLSearchParams(window.location.search);
    const showId = params.get("id");
    console.log(showId);



    const show = shows.find(show => show.id === showId);

    const image = document.getElementById("show-cover-img");
    image.src = show.image;
    image.alt = show.title;

    document.getElementById("show-title").textContent = show.title;
    document.getElementById("show-status").textContent = show.status;
    document.getElementById("show-myrate").textContent = show.myrate;
    document.getElementById("show-imdb").textContent = show.imdb;
    document.getElementById("show-seasons").textContent = show.seasons;
    document.getElementById("show-episodes").textContent = show.episodes;
    document.getElementById("show-description").textContent = show.description;
    document.getElementById("show-imdb-link").href = show.imdbUrl;
    document.getElementById("back-link").addEventListener("click", (e) => {
        e.preventDefault();
        history.back();
    });
    console.log(show);
</script>
</body>
</html>
